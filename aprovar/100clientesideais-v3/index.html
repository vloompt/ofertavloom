<!doctype html><html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Aprovar anúncios · 100 Clientes Ideais</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f1115;color:#eee;padding:12px 12px 110px}
h1{font-size:17px;margin:8px 4px 4px}p.s{font-size:13px;color:#9aa;margin:0 4px 14px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.g{grid-template-columns:repeat(4,1fr)}}
.c{position:relative;display:block;border-radius:12px;overflow:hidden;background:#1a1d24;line-height:0}
.c img{width:100%;display:block;opacity:.42;transition:opacity .15s}
.c input{position:absolute;opacity:0;pointer-events:none}
.c input:checked ~ img{opacity:1}
.t{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:#333;color:transparent;display:grid;place-items:center;font-size:15px;line-height:1}
.c input:checked ~ .t{background:#16a34a;color:#fff}
.n{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:3px 7px;border-radius:6px;line-height:1.3}
.bar{position:fixed;left:0;right:0;bottom:0;background:#11141a;border-top:1px solid #222;padding:12px;display:flex;gap:10px;align-items:center}
.bar b{font-size:14px}.bar button{margin-left:auto;background:#16a34a;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700}
textarea{position:fixed;left:12px;right:12px;bottom:70px;height:88px;display:none;border-radius:10px;border:1px solid #333;background:#0b0d12;color:#eee;padding:10px;font-size:12px}
</style></head><body>
<h1>Anúncios · 100 Clientes Ideais</h1>
<p class="s">20 peças. Toque para tirar as que não quer. No fim, carregue no botão e cole-me a lista.</p>
<div class="g"><label class="c" data-id="01"><input type="checkbox" checked><img src="img/01.jpg" loading="lazy"><b class="t">✓</b><span class="n">01</span></label>
<label class="c" data-id="02"><input type="checkbox" checked><img src="img/02.jpg" loading="lazy"><b class="t">✓</b><span class="n">02</span></label>
<label class="c" data-id="03"><input type="checkbox" checked><img src="img/03.jpg" loading="lazy"><b class="t">✓</b><span class="n">03</span></label>
<label class="c" data-id="04"><input type="checkbox" checked><img src="img/04.jpg" loading="lazy"><b class="t">✓</b><span class="n">04</span></label>
<label class="c" data-id="05"><input type="checkbox" checked><img src="img/05.jpg" loading="lazy"><b class="t">✓</b><span class="n">05</span></label>
<label class="c" data-id="06"><input type="checkbox" checked><img src="img/06.jpg" loading="lazy"><b class="t">✓</b><span class="n">06</span></label>
<label class="c" data-id="07"><input type="checkbox" checked><img src="img/07.jpg" loading="lazy"><b class="t">✓</b><span class="n">07</span></label>
<label class="c" data-id="08"><input type="checkbox" checked><img src="img/08.jpg" loading="lazy"><b class="t">✓</b><span class="n">08</span></label>
<label class="c" data-id="09"><input type="checkbox" checked><img src="img/09.jpg" loading="lazy"><b class="t">✓</b><span class="n">09</span></label>
<label class="c" data-id="10"><input type="checkbox" checked><img src="img/10.jpg" loading="lazy"><b class="t">✓</b><span class="n">10</span></label>
<label class="c" data-id="11"><input type="checkbox" checked><img src="img/11.jpg" loading="lazy"><b class="t">✓</b><span class="n">11</span></label>
<label class="c" data-id="12"><input type="checkbox" checked><img src="img/12.jpg" loading="lazy"><b class="t">✓</b><span class="n">12</span></label>
<label class="c" data-id="13"><input type="checkbox" checked><img src="img/13.jpg" loading="lazy"><b class="t">✓</b><span class="n">13</span></label>
<label class="c" data-id="14"><input type="checkbox" checked><img src="img/14.jpg" loading="lazy"><b class="t">✓</b><span class="n">14</span></label>
<label class="c" data-id="15"><input type="checkbox" checked><img src="img/15.jpg" loading="lazy"><b class="t">✓</b><span class="n">15</span></label>
<label class="c" data-id="16"><input type="checkbox" checked><img src="img/16.jpg" loading="lazy"><b class="t">✓</b><span class="n">16</span></label>
<label class="c" data-id="17"><input type="checkbox" checked><img src="img/17.jpg" loading="lazy"><b class="t">✓</b><span class="n">17</span></label>
<label class="c" data-id="18"><input type="checkbox" checked><img src="img/18.jpg" loading="lazy"><b class="t">✓</b><span class="n">18</span></label>
<label class="c" data-id="19"><input type="checkbox" checked><img src="img/19.jpg" loading="lazy"><b class="t">✓</b><span class="n">19</span></label>
<label class="c" data-id="20"><input type="checkbox" checked><img src="img/20.jpg" loading="lazy"><b class="t">✓</b><span class="n">20</span></label></div>
<textarea id="lista" readonly></textarea>
<div class="bar"><b id="cnt"></b><button id="bt">Ver os aprovados</button></div>
<script>
var cs=[].slice.call(document.querySelectorAll('.c input'));
function conta(){document.getElementById('cnt').textContent=cs.filter(function(c){return c.checked}).length+' de 20 aprovados';}
cs.forEach(function(c){c.addEventListener('change',conta)});conta();
document.getElementById('bt').addEventListener('click',function(){
  var l=[].slice.call(document.querySelectorAll('.c')).filter(function(e){return e.querySelector('input').checked}).map(function(e){return e.dataset.id});
  var t=document.getElementById('lista');t.style.display='block';t.value=l.join(', ');t.select();
  try{document.execCommand('copy')}catch(e){}
  this.textContent='Copiado. Cole-me a lista';
});
</script></body></html>
