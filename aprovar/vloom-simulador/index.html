:root{--g:#16a34a;--r:#ef4444}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f1115;color:#eee;padding:12px 12px 96px}
h1{font-size:17px;margin:6px 4px 14px}
.hint{font-size:13px;opacity:.7;margin:0 4px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;display:block;border-radius:12px;overflow:hidden;border:3px solid transparent;background:#1b1f27}
.card img{width:100%;display:block}
.card input{position:absolute;opacity:0;pointer-events:none}
.tick{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.idx{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:8px;font-size:12px}
.card:has(input:checked){border-color:var(--g)}
.card:has(input:checked) .tick{background:var(--g)}
.card:not(:has(input:checked)){opacity:.45}
.card:not(:has(input:checked)) .tick{background:var(--r)}
.card:not(:has(input:checked)) .tick::after{content:"✕"}
.card:not(:has(input:checked)) .tick span,.card:has(input:checked) .tick::after{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px;background:#0f1115ee;backdrop-filter:blur(8px);border-top:1px solid #222;display:flex;gap:10px;align-items:center}
button{flex:1;padding:15px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:var(--g);color:#fff}
button:disabled{opacity:.5}
.count{font-variant-numeric:tabular-nums}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0f1115ee;font-size:18px;text-align:center;padding:24px}

<script>
const PACK="vloom_simulador-amtq17",CAMP="120239749861610201",MARCA="vloom_simulador",BRIDGE="https://script.google.com/macros/s/AKfycbwlOJY1PG0oyLeQjoVMe62uxgNSStijGT3TRyDlM1grlAqmhSkwNWqortNckKGQ4_7oVQ/exec";
const cards=[...document.querySelectorAll('.card')],n=document.getElementById('n'),go=document.getElementById('go'),msg=document.getElementById('msg');
function upd(){n.textContent=cards.filter(c=>c.querySelector('input').checked).length}
cards.forEach(c=>c.addEventListener('change',upd));
go.onclick=async()=>{
  const approved=cards.filter(c=>c.querySelector('input').checked).map(c=>c.dataset.file);
  if(!approved.length){alert('Não escolheste nenhum.');return}
  if(!confirm('Subir '+approved.length+' ads à campanha do '+MARCA+'?'))return;
  go.disabled=true;go.textContent='A enviar…';
  try{
    const fd=new URLSearchParams();fd.set('pack',PACK);fd.set('campaignId',CAMP);fd.set('marca',MARCA);fd.set('approved',approved.join(','));
    await fetch(BRIDGE,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:fd.toString()});
  }catch(e){}
  msg.style.display='flex';
